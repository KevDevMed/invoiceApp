appId: com.invoiceapp.desktop
productName: InvoiceApp
copyright: Copyright © 2026 InvoiceApp

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  - '!**/*.map'

# better-sqlite3 is a native addon: keep it unpacked so the .node binary is a
# real file on disk rather than an asar entry.
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**

npmRebuild: true

# Ad-hoc signs the packed .app when no Developer ID certificate is available, so
# the shipped binary is executable at all on Apple Silicon. Runs before both the
# dmg/zip targets and electron-builder's own signing, and no-ops entirely when a
# real certificate is present. See the header of the hook for the full rationale.
afterPack: build/after-pack.cjs

mac:
  category: public.app-category.finance
  # Version-less on purpose. The landing and download pages link straight at
  # GitHub's `releases/latest/download/<asset>` endpoint, which needs the asset
  # name to be identical from one release to the next; the default
  # `${productName}-${version}-${arch}.${ext}` would break every link on release
  # day. Expands to InvoiceApp-mac-arm64.dmg / -x64.dmg and the matching .zips.
  artifactName: InvoiceApp-mac-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  # Applies to the real-certificate path only. electron-builder passes
  # `--options runtime` to codesign as part of ITS signing pass, and that pass
  # only happens when an identity is found (macPackager.sign -> isSignAllowed /
  # findIdentity). With no certificate there is no electron-builder signing pass,
  # so this key is inert and the afterPack hook's ad-hoc `codesign` deliberately
  # omits `--options=runtime`: hardened runtime is only meaningful alongside
  # notarisation, and under an ad-hoc signature it can block better-sqlite3's
  # .node addon and node-llama-cpp's dlopen'd backend from loading. Keeping it
  # here means the day MAC_CERT_P12 is added, the signed+notarised build gets
  # hardened runtime with no further change.
  hardenedRuntime: true
  gatekeeperAssess: false
  # Signing and notarisation credentials come from the environment on a macOS
  # build host. `package:mac` cannot be signed on Linux and is not run here.

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
