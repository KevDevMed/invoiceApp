appId: com.invoiceapp.desktop
productName: InvoiceApp
copyright: Copyright © 2026 InvoiceApp

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  - '!**/*.map'

# better-sqlite3 is a native addon: keep it unpacked so the .node binary is a
# real file on disk rather than an asar entry.
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**

npmRebuild: true

# Present even though CI packages with `--publish never`, which is the point:
# nothing here uploads anything. A `publish:` block is what makes electron-builder
# (a) emit `latest-mac.yml` next to the artifacts — the manifest `autoUpdater`
# fetches from GitHub Releases to learn a newer version exists — and (b) bake
# `app-update.yml` into the packaged app, without which `autoUpdater` throws at
# runtime because it has no feed to ask. The release workflow uploads the
# artifacts and the manifest itself.
publish:
  - provider: github
    owner: KevDevMed
    repo: invoiceApp

mac:
  category: public.app-category.finance
  # Version-less on purpose. The landing and download pages link straight at
  # GitHub's `releases/latest/download/<asset>` endpoint, which needs the asset
  # name to be identical from one release to the next; the default
  # `${productName}-${version}-${arch}.${ext}` would break every link on release
  # day. Expands to InvoiceApp-mac-arm64.dmg / -x64.dmg and the matching .zips.
  artifactName: InvoiceApp-mac-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  hardenedRuntime: true
  gatekeeperAssess: false
  # Signing and notarisation credentials come from the environment on a macOS
  # build host. `package:mac` cannot be signed on Linux and is not run here.

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
