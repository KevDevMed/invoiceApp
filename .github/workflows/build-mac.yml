# Build the macOS app on a real macOS runner.
#
# electron-builder cannot produce a mac target from Linux, so this is the only
# way to get an installable .dmg without a Mac in hand.
#
# Unsigned by default. macOS quarantines an unsigned download, so the first
# launch needs right-click > Open, or:
#   xattr -dr com.apple.quarantine /Applications/InvoiceApp.app
#
# To sign and notarize instead, add these repository secrets and the build
# picks them up automatically:
#   MAC_CERT_P12         base64 of a Developer ID Application .p12
#   MAC_CERT_PASSWORD    its password
#   APPLE_ID             Apple account email
#   APPLE_APP_PASSWORD   app-specific password
#   APPLE_TEAM_ID        10-character team id
#
# NOTE: macOS runner minutes bill at 10x on private repositories.

name: Build macOS app

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Attach the build to a GitHub release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    # The `secrets` context is not available in a step `if:` — only `env` is.
    # Lifting the secret to a job-level env var is what makes "sign only when a
    # certificate was configured" expressible at all.
    env:
      MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # node-llama-cpp fetches a llama.cpp backend matched to the host in its
      # postinstall. On an Apple Silicon runner that is the Metal backend, which
      # is the whole point of building here — skipping it would ship CPU-only
      # inference to a machine that can do far better.
      - name: Install dependencies
        run: npm ci
        env:
          npm_config_foreground_scripts: 'true'

      - name: Verify before packaging
        run: |
          npm run typecheck
          npm run lint
          npm run test:run

      - name: Import signing certificate
        if: env.MAC_CERT_P12 != ''
        env:
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KEYCHAIN=build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MAC_CERT_P12" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$MAC_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm -f /tmp/cert.p12

      # CSC_IDENTITY_AUTO_DISCOVERY=false keeps electron-builder from hunting for
      # an identity that is not there and failing the whole build over it.
      - name: Package
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.MAC_CERT_P12 != '' && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
        run: npm run package:mac -- --publish never

      - name: Show what was produced
        run: ls -lh release/ || ls -lh dist/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: invoiceapp-macos
          path: |
            release/*.dmg
            release/*.zip
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release/*.dmg
            release/*.zip
            dist/*.dmg
            dist/*.zip
